name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            cd ~/project

            git pull origin main

            cd backend

            docker stop project-backend || true
            docker rm project-backend || true

            docker build -t project-backend .

            docker run -d \
            -p 5000:5000 \
            --name project-backend \
            --env-file .env \
            project-backend

            cd ../frontend

            npm install
            npm run build

            sudo rm -rf /var/www/html/*
            sudo cp -r dist/. /var/www/html/

            sudo systemctl restart nginx